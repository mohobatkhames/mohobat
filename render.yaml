services:
  - type: web
    name: mohobat-khames
    env: node
    region: frankfurt # أو اختر المنطقة الأقرب لك مثل oregon أو ohio
    plan: free # أو اختر الخطة المناسبة (free / starter)
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # متغيرات البيئة الخاصة بـ Firebase (قم بتعبئتها بقيم مشروعك الفعلية في لوحة تحكم Render)
      - key: REACT_APP_FIREBASE_API_KEY
        sync: false
      - key: REACT_APP_FIREBASE_AUTH_DOMAIN
        value: mohobat-khames.firebaseapp.com
      - key: REACT_APP_FIREBASE_PROJECT_ID
        value: mohobat-khames
      - key: REACT_APP_FIREBASE_STORAGE_BUCKET
        value: mohobat-khames.appspot.com
      - key: REACT_APP_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: REACT_APP_FIREBASE_APP_ID
        sync: false
