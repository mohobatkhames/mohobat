name: keep-awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the website before visitors open it
        run: curl --retry 8 --retry-all-errors --retry-delay 10 -fsS -o /dev/null -w "%{http_code}" https://mohobat-khames.onrender.com/healthz
